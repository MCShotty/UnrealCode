name: Desktop acceptance
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go test ../cmd/unrealcode-host-files
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --testTimeout=15000
      - run: node --test scripts/check-secret-patterns.mjs
      - run: npm run build:win
      - run: node scripts/audit-release.mjs
      - run: node scripts/qa.mjs --no-docker --credentials --packaged
      - run: node scripts/qa-release-notifications.mjs --packaged
      - run: node scripts/qa-git-browser.mjs --packaged
      - run: node scripts/qa-102.mjs --packaged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-candidate
          path: desktop/dist/*.exe
          retention-days: 7
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: docker build -f Dockerfile.desktop -t unrealcode-ci .
      - run: node desktop/scripts/check-backend.mjs unrealcode-ci
